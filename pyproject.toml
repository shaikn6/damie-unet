[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "damie-unet"
version = "0.1.0"
description = "A plain PyTorch U-Net baseline for melt-pond segmentation"
requires-python = ">=3.10"
dependencies = ["torch", "numpy", "pillow"]
license = "MIT"
authors = [{name = "Nagizaaz Shaik"}]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.6"]

[tool.setuptools.packages.find]
include = ["damie_unet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
