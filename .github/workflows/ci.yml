name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only torch keeps the runner fast; the tests use synthetic data, no GPU or dataset.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx run ruff==0.17.6 check .
